<html lang="ja">
<head>
<meta charset="utf-8">

<title>貝取 バス発車案内</title>
<meta name="description" content="貝取周辺 8 方向の次のバスを表示する個人用アプリ">
<meta name="theme-color" content="#1B2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --bg: #EEF1F6;
    --card: #FFFFFF;
    --ink: #1B2740;
    --ink-2: #4A5568;
    --muted: #8A94A6;
    --line: #DCE1EA;
    --soon: #C8143F;       /* 京王バスの赤に寄せた「まもなく」色 */
    --soon-bg: #FBE9EE;
    --now: #1B2740;
    --radius: 14px;
    --out: #1E7F6B;      /* 家から：緑 */
    --out-bg: #E4F3EF;
    --home: #C4611C;     /* 駅から帰る：オレンジ */
    --home-bg: #FBEBDD;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161F; --card: #1C2230; --ink: #F1F4F9; --ink-2: #C3CAD6;
      --muted: #7E8898; --line: #2C3444; --soon: #FF5C7C; --soon-bg: #3A1A24;
      --out: #4FC7A9; --out-bg: #16302B; --home: #F0955A; --home-bg: #3A2416;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    font-feature-settings: "tnum" 1, "palt" 1;
    line-height: 1.4;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- ヘッダー ---------- */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin: 4px 4px 14px;
  }
  .clock { font-size: 44px; font-weight: 700; letter-spacing: 0.01em; line-height: 1; }
  .clock small { font-size: 18px; font-weight: 500; color: var(--ink-2); margin-left: 10px; }
  .daytype { display: flex; gap: 6px; align-items: center; }
  .daytype button {
    font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2); cursor: pointer;
  }
  .daytype button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .daytype button:focus-visible { outline: 3px solid #5B8DEF; outline-offset: 2px; }

  /* ---------- お知らせ帯 ---------- */
  .notice {
    margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; font-size: 15px;
    background: #FFF4D6; color: #5A4200; border: 1px solid #F1D48A;
  }
  .notice.bad { background: var(--soon-bg); color: var(--soon); border-color: transparent; }
  .notice:empty { display: none; }

  /* ---------- 発車ボード ---------- */
  .board { display: grid; gap: 22px; }
  .station { display: grid; gap: 10px; }
  .station h2 { margin: 0 4px; font-size: 22px; font-weight: 700; display: flex; align-items: baseline; gap: 14px; }
  .station h2 small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .cols { grid-template-columns: 1fr 1fr; } }
  .col { display: grid; gap: 12px; align-content: start; padding: 10px; border-radius: 18px; }
  .col.out  { background: var(--out-bg); }
  .col.home { background: var(--home-bg); }
  .col-label { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 0 4px; }
  .col-label b { display: inline-block; color: #fff; font-weight: 700; font-size: 15px; padding: 5px 12px; border-radius: 999px; }
  .col.out  .col-label b { background: var(--out); }
  .col.home .col-label b { background: var(--home); }
  .col.out  .col-label { color: var(--out); }
  .col.home .col-label { color: var(--home); }
  .col.out  .card { border-left: 6px solid var(--out); }
  .col.home .card { border-left: 6px solid var(--home); }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px 18px 14px;
    border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%;
    font: inherit; color: inherit; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px;
    align-items: end; min-height: 150px;
  }
  .card:focus-visible { outline: 3px solid #5B8DEF; outline-offset: 2px; }
  .card:active { transform: scale(0.99); }
  .card .route { grid-column: 1 / -1; font-size: 17px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .card .route b { color: var(--ink); font-weight: 600; }
  .card .route .arrow { color: var(--muted); }
  .card .next { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: 0.01em; }
  .card .line { display: inline-block; font-size: 14px; font-weight: 500; color: var(--card);
    background: var(--ink-2); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
  .card .plat { display: inline-block; font-size: 14px; font-weight: 600; color: var(--ink-2);
    border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .card .wait { font-size: 22px; font-weight: 600; text-align: right; color: var(--ink-2); white-space: nowrap; }
  .card .wait b { font-size: 40px; font-weight: 700; color: var(--ink); line-height: 1; }
  .card.soon .wait b, .card.soon .next { color: var(--soon); }
  .card .badges { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .card .after { grid-column: 1 / -1; font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .card .after .t + .t::before { content: "／"; color: var(--line); margin: 0 6px; }
  .card.none .next { font-size: 24px; font-weight: 500; color: var(--muted); align-self: center; }

  /* ---------- フッター ---------- */
  footer { margin: 18px 4px 0; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  footer button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; padding: 0; }

  /* ---------- 全日時刻表（ダイアログ） ---------- */
  dialog {
    border: 0; border-radius: 18px; padding: 0; width: min(680px, 92vw); max-height: 86vh;
    background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(10,14,24,.55); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .dlg-head small { display: block; color: var(--muted); font-size: 14px; font-weight: 400; margin-top: 2px; }
  .dlg-head button { font: inherit; font-size: 16px; border: 0; background: var(--bg); color: var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .dlg-body { overflow: auto; padding: 8px 22px 22px; max-height: calc(86vh - 70px); }
  .hour { display: grid; grid-template-columns: 44px 1fr; gap: 8px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .hour .h { font-size: 20px; font-weight: 700; color: var(--ink-2); }
  .hour .m { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 20px; }
  .hour .m span { position: relative; }
  .hour .m span.past { color: var(--muted); }
  .hour .m span.next { color: var(--soon); font-weight: 700; }
  .hour .m span i { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 2px; vertical-align: top; }

  @media (prefers-reduced-motion: reduce) { .card:active { transform: none; } }
</style>
</head>
<body>

<header>
  <div class="clock" id="clock">--:--<small id="dateLabel"></small></div>
  <div class="daytype" role="group" aria-label="ダイヤの種類">
    <button data-mode="auto" aria-pressed="true">今日</button>
    <button data-mode="weekday" aria-pressed="false">平日</button>
    <button data-mode="saturday" aria-pressed="false">土曜</button>
    <button data-mode="holiday" aria-pressed="false">日祝</button>
  </div>
</header>

<div class="notice" id="notice"></div>

<main class="board" id="board" aria-live="polite"></main>

<footer>
  <span id="dataInfo">時刻表を読み込んでいます…</span>
  <button id="reload" type="button">時刻表を再取得</button>
</footer>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlgTitle">時刻表<small id="dlgSub"></small></h2>
    <button type="button" id="dlgClose">閉じる</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
(() => {
  const DATA_URL = "data/timetable.json";
  const STORAGE_KEY = "kaidori-bus:timetable";
  const DAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];

  let data = null;
  let mode = "auto";           // auto | weekday | saturday | holiday
  let openDirId = null;

  // ---------- データ読み込み ----------
  // ネット優先。取れなければ前回保存分、それも無ければ埋め込みサンプル。
  async function loadData(force = false) {
    let fresh = null;
    try {
      const res = await fetch(DATA_URL + (force ? "?t=" + Date.now() : ""), { cache: "no-store" });
      if (res.ok) fresh = await res.json();
    } catch (_) { /* オフラインなど */ }

    if (fresh) {
      data = fresh;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch (_) {}
    } else if (!data) {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) data = JSON.parse(saved);
      } catch (_) {}
      if (!data) data = JSON.parse(document.getElementById("fallback").textContent);
    }
    render();
  }

  // ---------- 暦の計算 ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const dow = d => (d.getDay() + 6) % 7;            // GTFS は月曜=0

  function activeServices(date) {
    const key = ymd(date), w = dow(date), ids = [];
    for (const [sid, s] of Object.entries(data.services)) {
      if (s.add.includes(key)) { ids.push(sid); continue; }
      if (s.remove.includes(key)) continue;
      if (s.days[w] === 1 && s.start <= key && key <= s.end) ids.push(sid);
    }
    return new Set(ids);
  }

  // 「平日／土曜／日祝」を押したときに代表させる日付を探す
  function representativeDate(kind) {
    const holidayLike = new Set();
    for (const s of Object.values(data.services)) s.add.forEach(x => holidayLike.add(x));
    const d = new Date(); d.setHours(12, 0, 0, 0);
    for (let i = 0; i < 21; i++) {
      const w = d.getDay(), isHol = holidayLike.has(ymd(d));
      if (kind === "weekday"  && w >= 1 && w <= 5 && !isHol) return d;
      if (kind === "saturday" && w === 6 && !isHol) return d;
      if (kind === "holiday"  && (w === 0 || isHol)) return d;
      d.setDate(d.getDate() + 1);
    }
    return d;
  }

  // 表示対象の「便」を、今日（または代表日）の分だけ集めて分単位で返す
  function tripsFor(dir, baseDate) {
    const today = activeServices(baseDate);
    const list = dir.trips.filter(t => today.has(t.s)).map(t => ({ ...t }));
    // 深夜便対策：前日のサービスで 24:00 を超える便は「今日の早朝」として扱う
    const y = new Date(baseDate); y.setDate(y.getDate() - 1);
    const yest = activeServices(y);
    dir.trips.filter(t => yest.has(t.s) && t.t >= 1440).forEach(t => list.push({ ...t, t: t.t - 1440 }));
    list.sort((a, b) => a.t - b.t);
    // 同一時刻・同一系統の重複（複数乗り場の拾い過ぎ）を除く
    return list.filter((t, i) => i === 0 || !(t.t === list[i - 1].t && t.r === list[i - 1].r));
  }

  const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;

  // ---------- 描画 ----------
  function render() {
    if (!data) return;
    const now = new Date();
    const baseDate = mode === "auto" ? now : representativeDate(mode);
    // 「平日」などを押しても、それが今日と同じ日付なら現在時刻からの表示にする
    const isToday = ymd(baseDate) === ymd(now);
    const nowMin = isToday ? now.getHours() * 60 + now.getMinutes() : -1;

    document.getElementById("clock").innerHTML =
      `${pad(now.getHours())}:${pad(now.getMinutes())}<small id="dateLabel">${now.getMonth() + 1}/${now.getDate()}（${DAYS_JP[now.getDay()]}）</small>`;

    // お知らせ
    const notice = document.getElementById("notice");
    notice.className = "notice"; notice.textContent = "";
    if (data.sample) {
      notice.textContent = "サンプルデータを表示しています。実際のダイヤではありません。";
    } else if (mode !== "auto") {
      notice.textContent = `${baseDate.getMonth() + 1}/${baseDate.getDate()}（${DAYS_JP[baseDate.getDay()]}）のダイヤを表示中`;
    } else if (data.valid_until) {
      const end = new Date(+data.valid_until.slice(0, 4), +data.valid_until.slice(4, 6) - 1, +data.valid_until.slice(6, 8));
      const left = Math.floor((end - now) / 86400000);
      if (left < 0) { notice.textContent = "時刻表データの有効期限が切れています。更新が必要です。"; notice.classList.add("bad"); }
      else if (left <= 14) notice.textContent = `時刻表データはあと ${left} 日で期限切れになります。`;
    }

    // ボード：駅ごとに「家から」「駅から帰る」を横並びにする
    const board = document.getElementById("board");
    board.innerHTML = "";
    const stations = [...new Set(data.directions.map(d => d.station || d.dest))];
    for (const st of stations) {
      const sec = document.createElement("section"); sec.className = "station";
      sec.innerHTML = `<h2>${st}</h2>`;
      const cols = document.createElement("div"); cols.className = "cols";
      for (const role of ["out", "home"]) {
        const col = document.createElement("div"); col.className = "col " + role;
        col.innerHTML = role === "out"
          ? `<div class="col-label"><b>家から</b>${st}へ行く</div>`
          : `<div class="col-label"><b>駅から帰る</b>${st}から家へ</div>`;
        for (const dir of data.directions.filter(d => (d.station || d.dest) === st && (d.role || (d.dest === st ? "out" : "home")) === role)) {
          col.appendChild(buildCard(dir, baseDate, nowMin));
        }
        cols.appendChild(col);
      }
      sec.appendChild(cols);
      board.appendChild(sec);
    }

    // フッター
    const g = data.generated_at ? new Date(data.generated_at) : null;
    document.getElementById("dataInfo").textContent =
      `${data.source || ""}` +
      (g ? `　更新 ${g.getMonth() + 1}/${g.getDate()} ${pad(g.getHours())}:${pad(g.getMinutes())}` : "") +
      (data.valid_until ? `　有効期限 ${data.valid_until.slice(0, 4)}/${+data.valid_until.slice(4, 6)}/${+data.valid_until.slice(6, 8)}` : "");
  }

  function buildCard(dir, baseDate, nowMin) {
    const trips = tripsFor(dir, baseDate);
    const upcoming = trips.filter(t => t.t >= nowMin);
    const card = document.createElement("button");
    card.type = "button"; card.className = "card"; card.dataset.id = dir.id;
    card.setAttribute("aria-label", `${dir.origin}から${dir.dest}の時刻表を開く`);

    let body = `<div class="route"><b>${dir.origin}</b><span class="arrow">→</span>${dir.dest}</div>`;
    if (!trips.length) {
      card.classList.add("none");
      body += `<div class="next" style="grid-column:1/-1">この日の便はありません</div>`;
    } else if (!upcoming.length) {
      card.classList.add("none");
      const tmr = new Date(baseDate); tmr.setDate(tmr.getDate() + 1);
      const first = tripsFor(dir, tmr)[0];
      body += `<div class="next" style="grid-column:1/-1">本日の便は終了${first ? `　明日の始発 ${hhmm(first.t)}` : ""}</div>`;
    } else {
      const [n, ...rest] = upcoming;
      const wait = nowMin < 0 ? null : n.t - nowMin;
      if (wait !== null && wait <= 5) card.classList.add("soon");
      body += `<div class="next">${hhmm(n.t)}</div>`;
      body += wait === null ? `<div class="wait"></div>`
            : wait === 0 ? `<div class="wait"><b>まもなく</b></div>`
            : `<div class="wait">あと <b>${wait}</b> 分</div>`;
      const badges = (n.r ? `<span class="line">${n.r}</span>` : "") + (n.p ? `<span class="plat">${n.p}番乗り場</span>` : "");
      if (badges) body += `<div class="badges">${badges}</div>`;
      body += `<div class="after">${rest.slice(0, 3).map(t => `<span class="t">${hhmm(t.t)}</span>`).join("") || `<span class="t">次はありません</span>`}</div>`;
    }
    card.innerHTML = body;
    card.addEventListener("click", () => openDialog(dir, trips, nowMin, baseDate));
    return card;
  }

  function openDialog(dir, trips, nowMin, baseDate) {
    const dlg = document.getElementById("dlg");
    document.getElementById("dlgTitle").firstChild.textContent = `${dir.origin} → ${dir.dest}`;
    const plats = [...new Set(trips.map(t => t.p).filter(Boolean))];
    document.getElementById("dlgSub").textContent =
      `${baseDate.getMonth() + 1}/${baseDate.getDate()}（${DAYS_JP[baseDate.getDay()]}）のダイヤ` +
      (plats.length === 1 ? `　${plats[0]}番乗り場` : plats.length > 1 ? `　乗り場 ${plats.join("・")}番` : "");
    const body = document.getElementById("dlgBody");
    body.innerHTML = "";
    if (!trips.length) { body.innerHTML = `<p style="color:var(--muted);padding:20px 0">この日の便はありません。</p>`; }
    const nextIdx = trips.findIndex(t => t.t >= nowMin);
    const multiRoute = new Set(trips.map(t => t.r)).size > 1;   // 系統が複数あるときだけ系統名を添える
    const multiPlat  = new Set(trips.map(t => t.p)).size > 1;   // 乗り場が複数あるときだけ番号を添える
    const byHour = new Map();
    trips.forEach((t, i) => {
      const h = Math.floor(t.t / 60);
      if (!byHour.has(h)) byHour.set(h, []);
      byHour.get(h).push({ ...t, cls: i === nextIdx ? "next" : (nowMin >= 0 && t.t < nowMin ? "past" : "") });
    });
    for (const [h, list] of byHour) {
      const row = document.createElement("div"); row.className = "hour";
      row.innerHTML = `<div class="h">${pad(h % 24)}</div><div class="m">${
        list.map(t => `<span class="${t.cls}">${pad(t.t % 60)}${multiRoute && t.r ? `<i>${t.r}</i>` : ""}${multiPlat && t.p ? `<i>${t.p}番</i>` : ""}</span>`).join("")}</div>`;
      body.appendChild(row);
    }
    openDirId = dir.id;
    dlg.showModal();
    const nx = body.querySelector(".next"); if (nx) nx.scrollIntoView({ block: "center" });
  }

  // ---------- イベント ----------
  document.querySelectorAll(".daytype button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".daytype button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  }));
  document.getElementById("dlgClose").addEventListener("click", () => document.getElementById("dlg").close());
  document.getElementById("dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
  document.getElementById("reload").addEventListener("click", () => loadData(true));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); loadData(); } });

  // 毎分の頭で再描画（＋10 秒ごとの保険）
  setInterval(render, 10000);

  // Service Worker（https または localhost のときだけ）
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  loadData();
})();
</script>
